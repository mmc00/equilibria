name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gams:
        description: "Run GAMS parity tests (requires self-hosted runner with GAMS installed)"
        required: false
        default: false
        type: boolean

jobs:
  filename-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce lowercase filename policy
        run: python scripts/check_lowercase_filenames.py

      - name: Enforce canonical scripts layout
        run: |
          set -euo pipefail
          disallowed="$(git ls-files | grep -E '^scripts/[^/]+\.py$' | grep -v '^scripts/check_lowercase_filenames\.py$' || true)"
          if [ -n "$disallowed" ]; then
            echo "Disallowed root scripts detected. Use scripts/{cli,qa,parity,dev,sam_tools}/"
            echo "$disallowed"
            exit 1
          fi

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      # --- solvers: sin esto, 64 de 1151 tests se SALTABAN en silencio -------
      # Los guards de solver (tests/conftest.py) saltan needs_path/needs_ipopt
      # cuando la herramienta falta, asi que CI salia VERDE con esos tests
      # rotos: dos de ellos estuvieron rojos del 17 al 21 de septiembre sin que
      # nada avisara. No era una limitacion de licencia —la creencia de que
      # PATH no se podia instalar en CI resulto FALSA al ir a verificarla—:
      #   * la licencia de cortesia es publica y en claro (pages.cs.wisc.edu,
      #     HTTP 200 sin auth), sirve para cualquier tamano hasta 2035-12-31 y
      #     por eso va aqui a la vista y no en un secret;
      #   * el upstream publica libpath50.so (ELF x86-64) en el mismo sitio.
      # Falla duro a proposito (`set -euo pipefail` + checksum + smoke test):
      # si la descarga se cae, queremos rojo, no 64 skips que se ven igual que
      # un verde legitimo.
      - name: Install IPOPT
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends coinor-libipopt-dev coinor-libipopt1v5
          # Smoke test: que el .so este no prueba que se pueda cargar.
          python -c "import ctypes; ctypes.CDLL('libipopt.so')" || \
            python -c "import ctypes; ctypes.CDLL('libipopt.so.1')"

      - name: Install PATH solver library
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/path_linux.zip \
            "https://pages.cs.wisc.edu/~ferris/path/path_5.0.05_Linux64.zip"
          mkdir -p "$GITHUB_WORKSPACE/.cache/path_capi"
          unzip -q -j /tmp/path_linux.zip \
            "path_5/pathlib/lib/libpath50.so" \
            "path_5/pathlib/lib/liblusol.so" \
            -d "$GITHUB_WORKSPACE/.cache/path_capi"
          chmod +x "$GITHUB_WORKSPACE/.cache/path_capi"/*.so
          # Smoke test: que cargue de verdad, no solo que el archivo exista.
          python - <<'PY'
          import ctypes, os
          d = os.path.join(os.environ["GITHUB_WORKSPACE"], ".cache", "path_capi")
          ctypes.CDLL(os.path.join(d, "liblusol.so"), mode=ctypes.RTLD_GLOBAL)
          ctypes.CDLL(os.path.join(d, "libpath50.so"))
          print("PATH library loads OK")
          PY

      # path-capi-python no esta publicado en PyPI; se clona por SHA para que
      # el binding quede fijo y un push upstream no cambie lo que CI prueba.
      - name: Checkout path-capi-python
        uses: actions/checkout@v4
        with:
          repository: mmc00/path-capi-python
          ref: 786110fdb4ed274dff5b747cd10f19ce5cb0295c
          path: .path-capi-python

      # La suite completa, no una lista blanca. Hasta 2026-09-16 este paso
      # enumeraba 5 archivos de 172 (3,5 % de la suite), herencia de 2f5c128
      # ("stabilize tests for linux runner"): se listo lo que pasaba entonces y
      # el resto nunca se reconecto. Todo babel/ quedaba fuera, incluidos los
      # lectores HAR/GDX donde vivia el bug REFULL del PR #46.
      #
      # NO anadir -n/--numprocesses: los tests GTAP compiten por la libreria
      # PATH y por las caches de modelo, y en paralelo producen decenas de
      # fallos espurios (40 medidos; 1 real al correrlos aislados).
      #
      # `-ra` porque el default de pytest (-rfE) no reporta skips: los 64 que
      # habia aqui no decian ni cuales eran ni por que.
      - name: Run tests (excluding GAMS-marked and slow)
        env:
          EQUILIBRIA_PATH_CAPI_LIB_DIR: ${{ github.workspace }}/.cache/path_capi
          EQUILIBRIA_PATH_CAPI_SRC: ${{ github.workspace }}/.path-capi-python/src
          PATH_LICENSE_STRING: "1259252040&Courtesy&&&USR&GEN2035&5_1_2026&1000&PATH&GEN&31_12_2035&0_0_0&6000&0_0"
        run: |
          uv run pytest -ra -m "not gams and not slow" tests

  structural-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Structural Parity Gates
        run: |
          uv run python scripts/parity/run_pep_systemic_parity.py \
            --sam-file src/equilibria/templates/reference/pep2/data/SAM-V2_0.gdx \
            --val-par-file src/equilibria/templates/reference/pep2/data/VAL_PAR.xlsx \
            --init-mode excel \
            --method none \
            --save-report output/ci_structural_parity_report.json

      - name: Upload Structural Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-gates-report
          path: output/ci_structural_parity_report.json
          if-no-files-found: ignore

      - name: Print Structural Gate Summary
        if: always()
        run: |
          uv run python scripts/qa/print_structural_report_summary.py \
            output/ci_structural_parity_report.json

  structural-cri-contract-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run CRI Contract Gate (expect fail-fast as data_contract)
        run: |
          set +e
          uv run python scripts/parity/run_pep_systemic_parity.py \
            --sam-file src/equilibria/templates/reference/pep2/data/SAM-CRI-gams.xlsx \
            --dynamic-sam \
            --cri-fix-mode off \
            --method none \
            --save-report output/ci_cri_contract_report.json
          status=$?
          set -e

          if [ "$status" -ne 2 ]; then
            echo "Expected exit code 2 for CRI contract gate, got $status"
            exit 1
          fi

          python - <<'PY'
          import json
          import sys

          report = json.load(open("output/ci_cri_contract_report.json"))
          kind = report.get("classification", {}).get("kind")
          reason = report.get("classification", {}).get("reason")
          sam_qa_passed = report.get("sam_qa", {}).get("passed")

          if kind != "data_contract":
              print(f"Expected classification.kind=data_contract, got {kind!r}")
              sys.exit(1)
          if reason != "sam_qa_failed":
              print(f"Expected classification.reason=sam_qa_failed, got {reason!r}")
              sys.exit(1)
          if sam_qa_passed is not False:
              print(f"Expected sam_qa.passed=False, got {sam_qa_passed!r}")
              sys.exit(1)

          print("CRI contract gate classified correctly as data_contract/sam_qa_failed")
          PY

      - name: Upload CRI Contract Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-cri-contract-report
          path: output/ci_cri_contract_report.json
          if-no-files-found: ignore

      - name: Print CRI Contract Gate Summary
        if: always()
        run: |
          uv run python scripts/qa/print_structural_report_summary.py \
            output/ci_cri_contract_report.json

  structural-cri-fixed-pass-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run CRI Fixed Pass Gate (QA + macro closure)
        run: |
          uv run python scripts/parity/run_pep_systemic_parity.py \
            --sam-file src/equilibria/templates/reference/pep2/data/SAM-CRI-gams-fixed.xlsx \
            --val-par-file src/equilibria/templates/reference/pep2/data/VAL_PAR-CRI-gams.xlsx \
            --dynamic-sam \
            --init-mode gams \
            --gams-results-slice sim1 \
            --disable-strict-gams-baseline-check \
            --init-gates-mode gams_anchor \
            --method none \
            --save-report output/ci_cri_fixed_pass_report.json

          python - <<'PY'
          import json
          import sys

          report = json.load(open("output/ci_cri_fixed_pass_report.json"))
          kind = report.get("classification", {}).get("kind")
          sam_qa = report.get("sam_qa", {}).get("passed")
          blocks = {
              b.get("block"): b
              for b in report.get("init", {}).get("gates", {}).get("blocks", [])
          }
          macro = blocks.get("macro_closure", {})
          macro_pass = macro.get("passed")

          if kind != "pass":
              print(f"Expected classification.kind=pass, got {kind!r}")
              sys.exit(1)
          if sam_qa is not True:
              print(f"Expected sam_qa.passed=True, got {sam_qa!r}")
              sys.exit(1)
          if macro_pass is not True:
              print(f"Expected macro_closure gate to pass, got {macro_pass!r}")
              sys.exit(1)

          print("CRI fixed gate passed: QA and macro closure are consistent")
          PY

      - name: Upload CRI Fixed Pass Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-cri-fixed-pass-report
          path: output/ci_cri_fixed_pass_report.json
          if-no-files-found: ignore

      - name: Print CRI Fixed Pass Summary
        if: always()
        run: |
          uv run python scripts/qa/print_structural_report_summary.py \
            output/ci_cri_fixed_pass_report.json

  structural-cri-solver-dynamics-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run CRI Solver-Dynamics Classification Gate
        run: |
          set +e
          uv run python scripts/parity/run_pep_systemic_parity.py \
            --sam-file src/equilibria/templates/reference/pep2/data/SAM-CRI-gams-fixed.xlsx \
            --val-par-file src/equilibria/templates/reference/pep2/data/VAL_PAR-CRI-gams.xlsx \
            --dynamic-sam \
            --init-mode gams \
            --gams-results-slice sim1 \
            --disable-strict-gams-baseline-check \
            --init-gates-mode gams_anchor \
            --method __debug_simple_iteration \
            --max-iterations 0 \
            --save-report output/ci_cri_solver_dynamics_report.json
          status=$?
          set -e

          if [ "$status" -ne 2 ]; then
            echo "Expected exit code 2 for CRI solver-dynamics case, got $status"
            exit 1
          fi

          python - <<'PY'
          import json
          import sys

          report = json.load(open("output/ci_cri_solver_dynamics_report.json"))
          kind = report.get("classification", {}).get("kind")
          reason = report.get("classification", {}).get("reason")
          sam_qa = report.get("sam_qa", {}).get("passed")
          init_ok = report.get("init", {}).get("gates", {}).get("overall_passed")
          converged = report.get("solve", {}).get("converged")

          if kind != "solver_dynamics":
              print(f"Expected classification.kind=solver_dynamics, got {kind!r}")
              sys.exit(1)
          if reason != "solve_not_converged":
              print(f"Expected classification.reason=solve_not_converged, got {reason!r}")
              sys.exit(1)
          if sam_qa is not True:
              print(f"Expected sam_qa.passed=True, got {sam_qa!r}")
              sys.exit(1)
          if init_ok is not True:
              print(f"Expected init gates to pass before solver failure, got {init_ok!r}")
              sys.exit(1)
          if converged is not False:
              print(f"Expected solve.converged=False, got {converged!r}")
              sys.exit(1)

          print("CRI solver-dynamics gate classified correctly after QA and init pass")
          PY

      - name: Upload CRI Solver-Dynamics Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-cri-solver-dynamics-report
          path: output/ci_cri_solver_dynamics_report.json
          if-no-files-found: ignore

      - name: Print CRI Solver-Dynamics Summary
        if: always()
        run: |
          uv run python scripts/qa/print_structural_report_summary.py \
            output/ci_cri_solver_dynamics_report.json

  structural-solver-dynamics-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Solver-Dynamics Classification Gate
        run: |
          set +e
          uv run python scripts/parity/run_pep_systemic_parity.py \
            --sam-file src/equilibria/templates/reference/pep2/data/SAM-V2_0.gdx \
            --val-par-file src/equilibria/templates/reference/pep2/data/VAL_PAR.xlsx \
            --init-mode excel \
            --method __debug_simple_iteration \
            --max-iterations 0 \
            --save-report output/ci_solver_dynamics_report.json
          status=$?
          set -e

          if [ "$status" -ne 2 ]; then
            echo "Expected exit code 2 for forced solver-dynamics case, got $status"
            exit 1
          fi

          python - <<'PY'
          import json
          import sys

          report = json.load(open("output/ci_solver_dynamics_report.json"))
          kind = report.get("classification", {}).get("kind")
          reason = report.get("classification", {}).get("reason")
          init_ok = report.get("init", {}).get("gates", {}).get("overall_passed")
          converged = report.get("solve", {}).get("converged")

          if kind != "solver_dynamics":
              print(f"Expected classification.kind=solver_dynamics, got {kind!r}")
              sys.exit(1)
          if reason != "solve_not_converged":
              print(f"Expected classification.reason=solve_not_converged, got {reason!r}")
              sys.exit(1)
          if init_ok is not True:
              print(f"Expected init gates to pass before solver failure, got {init_ok!r}")
              sys.exit(1)
          if converged is not False:
              print(f"Expected solve.converged=False, got {converged!r}")
              sys.exit(1)

          print("Solver-dynamics gate classified correctly after passing init gates")
          PY

      - name: Upload Solver-Dynamics Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-solver-dynamics-report
          path: output/ci_solver_dynamics_report.json
          if-no-files-found: ignore

      - name: Print Solver-Dynamics Summary
        if: always()
        run: |
          uv run python scripts/qa/print_structural_report_summary.py \
            output/ci_solver_dynamics_report.json

  gtap7-nl-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run GTAP7 .nl parity gate
        run: |
          uv run pytest tests/templates/gtap/test_gtap7_nl_parity.py -v \
            --tb=short

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run prek hooks (all files)
        run: uvx prek run --all-files --show-diff-on-failure

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build site (warnings are errors)
        run: uv run sphinx-build -W -b html docs/site docs/site/_build/html

  # Vigila que el modelo se construya IGUAL en las tres plataformas. Existe
  # porque el problema YA mordio: en e785deb el hash de la firma difería entre
  # mac 3.11, mac 3.12 y linux, y 3.462 de 37.638 filas cambiaban por 1-2 ULP.
  # Vienen de alphad = (xda/xaa)*(pdp/pa)**sigma_m: pow() con exponente
  # fraccionario, que libm no redondea correctamente y varía legitimamente entre
  # builds. Se parcheo redondeando los literales a 13 cifras significativas.
  #
  # Ese parche no tenia quien lo vigilara: CI era ubuntu-latest y una sola
  # version de Python, o sea que la plataforma que lo rompio NO se probaba.
  # Si 13 cifras dejan de alcanzar en algun runner, este job lo dice; sin el,
  # la firma se rompe en silencio para quien no use linux.
  #
  # Barato a proposito: solo el archivo de la firma. No necesita solver (los
  # tests con solver se saltan solos por sus guards) y el dataset gtap7_10x7
  # esta commiteado (228K), asi que no descarga nada.
  model-signature-cross-platform:
    strategy:
      fail-fast: false        # que un runner rojo no oculte el estado de los otros
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Model signature is identical across OS and interpreter
        run: uv run pytest tests/templates/gtap/test_multiperiod_build_once.py -v

  gams-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gams }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run GAMS parity tests
        run: uv run pytest -m gams
