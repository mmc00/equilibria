name: Release

# Builds the sdist and wheel and publishes them with PyPI Trusted Publishing
# (OIDC): no API token is stored in the repository.
#
# - Pushing a tag vX.Y.Z (or a pre-release such as v0.6.2a1) publishes to PyPI.
# - Running the workflow by hand publishes to TestPyPI, to try a release first.
#
# One-time setup, by the maintainer on pypi.org and test.pypi.org:
#   Project "equilibria" -> Publishing -> Add a trusted publisher (GitHub):
#   owner mmc00, repository equilibria, workflow release.yml,
#   environment "pypi" (PyPI) or "testpypi" (TestPyPI).
# and in GitHub: Settings -> Environments -> create "pypi" and "testpypi".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel installs and imports
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/python -c "import equilibria; print(equilibria.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    # push only: a manual run started from a tag also has ref_type 'tag', and
    # must go to TestPyPI, not to PyPI
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/equilibria
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/equilibria
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI refuses a version it already has; a re-run of the same
          # version should not fail the workflow.
          skip-existing: true
