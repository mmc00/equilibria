  <rect x="20" y="190" width="250" height="70" rx="8" class="box-jax"/><text x="145" y="218" text-anchor="middle" class="lbl">m = RecordingModel (the clay)</text><text x="145" y="238" text-anchor="middle" class="sm">family/recorder.py</text><path d="M270,225 C320,225 320,175 356,172" class="ln-jax" marker-end="url(#two-objects-ahj)"/>
  <path d="M600,128 C640,128 640,80 686,80" class="ln-pyo" marker-end="url(#two-objects-ahp)"/><rect x="690" y="40" width="250" height="70" rx="8" class="box-pyo"/><text x="815" y="68" text-anchor="middle" class="lbl">a Pyomo constraint</text><text x="815" y="88" text-anchor="middle" class="sm">goes to Constraint, then to the .nl</text>
  <path d="M600,172 C640,172 640,225 686,225" class="ln-jax" marker-end="url(#two-objects-ahj)"/><rect x="690" y="190" width="250" height="70" rx="8" class="box-jax"/><text x="815" y="218" text-anchor="middle" class="lbl">a tree, Residual (the mold)</text><text x="815" y="238" text-anchor="middle" class="sm">goes to FamilyBackend.records</text></svg>
