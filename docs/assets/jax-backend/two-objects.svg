<svg viewBox="0 0 960 300" role="img" xmlns="http://www.w3.org/2000/svg" class="jxb wide"><title>The same rule receives a Pyomo model or a RecordingModel and returns a constraint or a tree</title><defs><marker id="two-objects-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="two-objects-ahj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head-jax"/></marker><marker id="two-objects-ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head-pyo"/></marker></defs>
  <rect x="360" y="100" width="240" height="100" rx="12" class="box-common"/><text x="480" y="132" text-anchor="middle" class="lbl" font-weight="700">eq_xaa_activity</text><text x="480" y="154" text-anchor="middle" class="sm mono">build_expression(m, (r,i,a))</text><text x="480" y="176" text-anchor="middle" class="sm">asks for: m.xaa · m.nd · m.pnd · m.pa</text>
