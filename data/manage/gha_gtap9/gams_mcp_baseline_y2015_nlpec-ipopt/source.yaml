notes: 'MANAGE-WB Ghana, task Baseline, shock file none.inc: base year 2014 (the bridge
  file''s BaseYear, from the GTAP 9 template) calibrated, 2015 solved; dynamics (forward
  looking, vintages, labor vintages, endogenous technology), climate damages and the
  Invest link off. The command runs run_gha_one_year.sh in a temporary copy of manage/gams
  from the recorded bridge file: the benchmark check, the balanced growth check (their
  outputs are not kept) and the baseline, whose 2015 MCP (9,452 rows and columns,
  all free, all equalities) NLPEC solves with IPOPT in one attempt (solve status 1,
  model status 1, 0 infeasibilities). GHA_BaU.gdx holds every symbol after inc/cal/rescale.inc
  (levels unscaled); gha2015_scalar.gms and gha2015_solution.gms are the CONVERT scalar
  model at the start and at the solution of the 2015 solve (x1..xN, names in gha2015_dict.txt,
  levels in the model''s internal scaling); gha2015_path.gms is the NEOS file made
  from the start point (its CONVERT time stamp differs from the file sent to NEOS,
  recorded in gams_mcp_baseline_y2015_path). The benchmark check does not replicate
  in GAMS itself: inc/solve/resLastYear.inc lines 393-394 copy tPaf and tPaf0 to the
  new year only for iExp, so the 7 goods Ghana does not export (c-coa, c-wol, c-wht,
  c-gas, c-sgr, c-c_b, c-gdt) start at tPaf = 0 (largest residual 2.33 in e_paf(c-coa,a-i_s)),
  and line 275 copies nshrGDP only for factors (residual 0.68 in e_nshrGDP(h-hhold));
  the baseline solve starts from the same point and converges. The 2015 output of
  a-ele rises 10.5 times and that of a-omf falls to 0.53 times; it is the model''s
  equilibrium: PATH on NEOS from the same start point reaches the same point (max
  abs difference 1.1e-6, max relative 7.9e-9 over the 9,452 variables). PATH and CONOPT4
  cannot solve it locally: the local license limits them to demo size.'
