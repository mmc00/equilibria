kind: data
model: manage
dataset: gha_gtap9
source: Ghana (GTAP region GHA) bridge files of MANAGE-WB, made from manage/gams_wb/dat/gtapData9.gdx
  by manage/gams/run_gha_one_year.sh steps 1-2 (gtapSamV6.gms with mac/gui_prepare_gtap_sam.gms,
  the GUI task Prepare GTAP SAM; then mac/fix_bridge.py) on macOS 26.2, GAMS 53.5.0,
  LibreOffice for the recalculation, 2026-11-27. BaseBridge_GHA_GTAP_9.xlsx and SAM_GHA_GTAP.xlsx
