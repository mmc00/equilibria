notes: 'dat/gtapData9.gdx is derived from the GTAP 9 Data Base, a free archived release:
  Aguiar, A., Narayanan, B. and McDougall, R. (2016), An Overview of the GTAP 9 Data
  Base, Journal of Global Economic Analysis 1(1), 181-208. The maintainer approved
  keeping it in the repository (2026-11-27). gtapSamV6.gms names the bridge template
  dat/Bridgefile_GTAP_9_template.xlsx while the file is BridgeFile_...; it is found
  on a case-insensitive file system (macOS default).'
