  the MCP) because the local GAMS license allows PATH and CONOPT4 only for demo-size
  models; the small calibration NLPs still run with CONOPT4 inside the demo limits.
  The PATH solve is done on NEOS from the CONVERT file (manage/gha_gtap9/gams_mcp_baseline_y2015_path).'
