kind: model
model: manage
source: 'The MANAGE-WB model that runs on macOS: manage/gams_wb plus the changes listed
  below, from the local branch mac-one-year of github.com/worldbank/MANAGE-WB (never
  pushed; commits 6ef8b4b, cf08900, aadc374, b684613, df83939). run_gha_one_year.sh
  runs the pipeline; needs GAMS 53 and LibreOffice'
derived_from: manage/gams_wb
changes:
- file: gtapSamV6.gms
  change: modified
  what: the four GDXXRW calls (template read, macro read, bridge and SAM writes) call
    %gdxxrw% from inc/gdxxrw_cmd.inc; the Windows-only 'copy' of the shock files runs
    only on Windows; the 'cp' of the shock files uses %system.dirsep% instead of a
    backslash
  why: GDXXRW needs Windows and Excel; on macOS the failed 'copy' call stops the compilation,
    and the backslash path does not exist there
  commit: manage-wb mac-one-year 6ef8b4b
- file: inc/opt.inc
  change: modified
  what: the GDXXRW call that converts the bridge xlsx to sav/<bridge>.gdx includes
    inc/gdxxrw_cmd.inc and calls %gdxxrw%
  why: GDXXRW needs Windows and Excel
  commit: manage-wb mac-one-year 6ef8b4b
- file: inc/Base.inc
  change: modified
  what: $elseif exist "%datF%\%version%.gdx" uses a forward slash
  why: with the backslash the test is never true on macOS, land0, lCov0 and carbCnt
    stay unassigned and inical.inc does not compile (error 141)
  commit: manage-wb mac-one-year cf08900
- file: run.gms
  change: modified
  what: with %convertMCP%=on, the first solve attempt of each year is also written
    with CONVERT, at its start point (convert.opt) and at its solution (convert.op2);
    the model's solve statistics, option file and iteration count are restored after
    the second CONVERT call
  why: the scalar model is what PATH solves on NEOS (the local license allows PATH
    only for demo-size models); the solution point checks the scalar model against
    the real run. With convertMCP off nothing changes; with it on, gdxdiff shows no
    difference in any variable or equation
  commit: manage-wb mac-one-year aadc374
- file: inc/gdxxrw_cmd.inc
  change: added
  what: sets %gdxxrw% to mac/gdxxrw.py under the GAMS Python on UNIX and to gdxxrw.exe
    elsewhere
  why: one place that picks the GDXXRW replacement
  commit: manage-wb mac-one-year 6ef8b4b
- file: mac/gdxxrw.py
  change: added
  what: openpyxl and gams.transfer replacement for the GDXXRW calls MANAGE makes (read
    with an index sheet, par/set/dset, dSetText, MaxDupeErrors, @file; write par);
    empty label cells become the empty label, zeros are not stored, Eps/Inf/NA strings
    become special values; written workbooks are recalculated with LibreOffice so
    formula cells keep their values
  why: GDXXRW needs Windows and Excel. An independent read with GAMS Connect's ExcelReader
    gives the same SAM0, defPar, comPar, actPar, fmNest, pnest, GDPComp and energyProj,
    except the records with an empty label that Connect drops and GDXXRW keeps
  commit: manage-wb mac-one-year 6ef8b4b
- file: mac/fix_bridge.py
  change: added
  what: blanks the single placeholder 'eps' that dat/BridgeFile_GTAP_9_template.xlsx
    leaves in hohPar!D16 (xfmSupDistrInst h-hhold.f-tech_aspros.a-PDR) of the bridge
    file
  why: read as Eps it switches off the SAM factor income shares of f-tech_aspros and
    inc/cal/inical.inc stops with 'division by eps'; gtapSamV6.gms computes xfmSupDistr
    but kills it before writing, and the GTAP_POW template has this block empty
  commit: manage-wb mac-one-year cf08900
- file: mac/gui_prepare_gtap_sam.gms
  change: added
  what: the settings the GUI writes to fromGuiToRun.gms for the task Prepare GTAP
    SAM, GUI defaults from gui/manage.xml, region GHA, gtapData9, QCP solver IPOPT
  why: no GUI on macOS; CONOPT4 (the GUI default for the balancing QCP) exceeds the
    local license
  commit: manage-wb mac-one-year 6ef8b4b, cf08900
- file: mac/gui_baseline_one_year.gms
  change: added
  what: the settings the GUI writes to fromGuiToRun.gms for the task Baseline, GUI
    defaults, dynamics (forward looking, vintages, labor vintages, endogenous technology),
    damages and links off, shock file none.inc, last year = base year + 1
  why: no GUI on macOS; one solved year as the reference
  commit: manage-wb mac-one-year cf08900
- file: mac/gui_meta_items.gms
  change: added
  what: the set allMetaItems (titles of all worksteps, tasks and controls of gui/manage.xml)
    that the GUI also writes to fromGuiToRun.gms
  why: inc/output/reportDecl.inc uses it and nothing else declares it
  commit: manage-wb mac-one-year cf08900
- file: mac/opt/nlpec.opt
  change: added
  what: NLPEC options of opt/nlpec.opt with IPOPT as subsolver
  why: PATH and CONOPT4 exceed the local license at 9,452 rows; NLPEC with IPOPT solves
    the MCP
  commit: manage-wb mac-one-year cf08900
- file: mac/opt/convert.opt
  change: added
  what: CONVERT options for the start point of the 2015 solve (scalar GAMS model,
    dictionary, dictionary map)
  why: see run.gms
  commit: manage-wb mac-one-year aadc374
- file: mac/opt/convert.op2
  change: added
  what: CONVERT options for the solution point of the 2015 solve
  why: see run.gms
  commit: manage-wb mac-one-year aadc374
- file: mac/make_neos_model.py
  change: added
  what: turns the CONVERT scalar model into the NEOS file (PATH as MCP solver, reslim
    600, a display of all levels)
  why: NEOS cp:PATH:GAMS takes one model file
  commit: manage-wb mac-one-year aadc374
- file: mac/neos_submit.py
  change: added
  what: NEOS XML-RPC submission (category cp, solver PATH, input GAMS), e-mail from
    NEOS_EMAIL, polling, results in mac/neos/<job>/; submits only with --submit
  why: PATH has to run on NEOS
  commit: manage-wb mac-one-year aadc374, b684613
- file: mac/neos_collect.py
  change: added
  what: copies a fetched NEOS job and the file sent into a result folder with neos_job.json
    (no password, no e-mail)
  why: records the NEOS result without submitting again
  commit: manage-wb mac-one-year df83939
- file: run_gha_one_year.sh
  change: added
  what: the whole pipeline without the GUI, reslim=600 and /usr/bin/time -l on each
    GAMS run - gtapSamV6.gms, fix_bridge.py, benchmark check, balanced growth check,
    baseline with CONVERT, NEOS file; BRIDGE=<xlsx> starts from a recorded bridge
    file, OUT=<dir> copies the baseline results
  why: one reproducible command on macOS
  commit: manage-wb mac-one-year cf08900, aadc374, df83939
