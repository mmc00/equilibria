model: gtap7
source: 'equilibria''s drivers of the RunGTAP GEMPACK solver (gtapv7.exe): tools/run_gempack_matrix.py
  writes the .cmf and solves one job, tools/regenerate_gempack.py runs the matrix
  under write_source (phase 3a-1). tools/regenerate_paper.py lists the phase 3a-2
  jobs (corridas_paper.ps1 steps 1-7 and runs/) and runs each job module (burfisher_job,
  levels_job, gemsim_job, swap_job) under write_source; tools/make_levels_tab.py patches
  RunGTAP''s gtapv7.tab (data/gtap7/gempack_rungtap375) for six more levels, tools/export_sl4_levels.py
  exports the levels of a .sl4, tools/release_check.py checks the GEMPACK release
  a console names. The compiled models (gtapv7.exe, gtapuv7.exe) are not redistributed
  here.'
