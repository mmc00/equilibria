kind: model
model: gtap7
source: 'The GTAP v7 GAMS model equilibria runs: gtap7/gams_jgea plus the changes
  listed below, each with what, why and the commit'
derived_from: gtap7/gams_jgea
changes:
- file: comp.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    ifCSV/ifCSVAppend become globals; set labels c_ProcFood, c_TextWapp capitalized;
    'shock' in single quotes; iterlim 1000 -> 50000 in the solve options
  why: 'defaults: run with the bundled 9x10 data and let callers pass --inDir (4be9bcf).
    iterlim: with 1000 the altertax check period stopped mid-iteration with status
    2 (3e758c8); it only lets PATH iterate longer, a converged solution is the same.
    ifCSV, label case and quotes came with the curated copy (cge_babel e63a738), reason
    not recorded; the bundle builders now anchor on the single-quoted shock line'
  commit: 4be9bcf, 3e758c8, cge_babel e63a738
- file: getData.gms
  change: modified
  what: execute_load / execute_loaddc of Dat, Emiss and Prm become compile-time $gdxin
    + $load / $loadDC
  why: NEOS runs the model remotely without the local GDX files at execution time;
    loading at compile time embeds the data. Same symbols, same values
  commit: cge_babel e63a738
- file: gft.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: gftCapFix.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: GFTCET.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: GFTFlxFF.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: GFTLnd.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: iterloop.gms
  change: modified
  what: pwmg.l = 0 on routes with no trade margin (not tmgFlag) before each solve
  why: cal.gms leaves pwmg = 1 on those routes; the 9x10 reference GDX has 0 there.
    Reported level of a variable with no equation; no equation changes
  commit: cd51b48
- file: postsim.gms
  change: modified
  what: pdp = pd*(1+dintx) and pmp = pmt*(1+mintx) recomputed for every cell after
    the solve
  why: where alpha = 0 the pdp/pmp equations are off and iterloop leaves their cal.gms
    value 1.0; the 9x10 reference GDX and the NEOS run of NUS333 both recompute them
    for every cell, and the local run was the only one that did not (10 shock cells,
    99.24 %). Reported levels only
  commit: 131339b
- file: comp_altertax.gms
  change: added
  what: comp.gms with the altertax elasticities (Cobb-Douglas value added and nests,
    Armington 0.95, all factors mobile)
  why: the altertax reference model of the bundle builders. It lived untracked in
    ~/proyectos2/cge_babel/standard_gtap_7 and is committed here as found (2026-10-29)
  commit: this change
- file: altertax_config.gms
  change: added
  what: altertax configuration included by the altertax NEOS bundles
  why: altertax reference regeneration (#18)
  commit: 3e758c8
- file: altertax_postmodel.gms
  change: added
  what: altertax post-model block included by the altertax NEOS bundles
  why: altertax reference regeneration (#18)
  commit: 3e758c8
- file: comp_nus333.gms
  change: added
  what: comp.gms with the NUS333 sets (3 sectors x 2 regions, 3 mobile factors)
  why: NUS333 comparison against NEOS
  commit: 37f4f5b
- file: comp_nus333_landshock.gms
  change: added
  what: comp_nus333.gms with a ROW land productivity shock
  why: pin the NUS333 land-shock parity against NEOS
  commit: 54fa5ba
- file: tariff_sim.gms
  change: added
  what: comparative static run with a 10 % import tariff increase
  why: tariff simulation used by the baseline mirror test
  commit: 9ac8ce1
- file: tariff_sim_fixed.gms
  change: added
  what: tariff_sim.gms variant that includes comp.gms from EQUILIBRIA_CGE_BABEL_DIR
  why: tariff simulation against the external copy
  commit: 9ac8ce1
- file: report_fixed_run.inc
  change: added
  what: report of fixed/free variables per period
  why: diagnostics included by cal_dump.gms
  commit: 9ac8ce1
- file: report_fixed_setup.inc
  change: added
  what: set-up of the fixed/free report
  why: diagnostics included by cal_dump.gms
  commit: 9ac8ce1
- file: cal_dump.gms
  change: added
  what: runs calibration only and dumps every symbol to gams_cal_dump_<base>.gdx
  why: calibration parity against Python
  commit: 9ac8ce1
- file: cal_dump_neos.gms
  change: added
  what: cal_dump.gms laid out for NEOS (GTAP include and data conventions)
  why: calibration dump of models above the local license
  commit: 9ac8ce1
