kind: model
model: gtap7
source: 'The GTAP v7 GAMS model equilibria runs: gtap7/gams_jgea plus the changes
  listed below, each with what, why and the commit'
derived_from: gtap7/gams_jgea
changes:
- file: comp.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    ifCSV/ifCSVAppend become globals; set labels c_ProcFood, c_TextWapp capitalized;
    'shock' in single quotes; iterlim 1000 -> 50000 in the solve options
  why: 'defaults: run with the bundled 9x10 data and let callers pass --inDir (4be9bcf).
    iterlim: with 1000 the altertax check period stopped mid-iteration with status
    2 (3e758c8); it only lets PATH iterate longer, a converged solution is the same.
    ifCSV, label case and quotes came with the curated copy (cge_babel e63a738), reason
    not recorded; the bundle builders now anchor on the single-quoted shock line'
  commit: 4be9bcf, 3e758c8, cge_babel e63a738
- file: getData.gms
  change: modified
  what: execute_load / execute_loaddc of Dat, Emiss and Prm become compile-time $gdxin
    + $load / $loadDC
  why: NEOS runs the model remotely without the local GDX files at execution time;
    loading at compile time embeds the data. Same symbols, same values
  commit: cge_babel e63a738
- file: gft.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: gftCapFix.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: GFTCET.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: GFTFlxFF.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: GFTLnd.gms
  change: modified
  what: baseName/inDir/outDir become overridable defaults (9x10, ../data, ../output);
    'shock' in single quotes
  why: same as comp.gms (4be9bcf); quotes came with the curated copy, reason not recorded
  commit: 4be9bcf, cge_babel e63a738
- file: iterloop.gms
  change: modified
  what: pwmg.l = 0 on routes with no trade margin (not tmgFlag) before each solve
  why: cal.gms leaves pwmg = 1 on those routes; the 9x10 reference GDX has 0 there.
    Reported level of a variable with no equation; no equation changes
  commit: cd51b48
- file: cal.gms
  change: modified
  what: sigmap, sigmand and sigmav equal to 1 become 1.01 after the elasticities are
    set, before the shares are calibrated (#192)
  why: at exactly 1 the power-form pxeq, pndeq and pvaeq reduce to 1 = 1 and stop
    pinning px, pnd and pva; altertax sets all three to 1, so its check had a continuum
    of solutions (two IPOPT starts, EV 16 % apart) and the 5x5 ifSUB=0 check failed.
    cal.gms already does this for sigmag, sigmai and sigmamg; the exact Cobb-Douglas
    limit with a base scale differs from 1.01 by at most 3e-5 in the 10x7 shock
  commit: this change
- file: postsim.gms
  change: modified
  what: pdp = pd*(1+dintx) and pmp = pmt*(1+mintx) recomputed for every cell after
    the solve
  why: where alpha = 0 the pdp/pmp equations are off and iterloop leaves their cal.gms
    value 1.0; the 9x10 reference GDX and the NEOS run of NUS333 both recompute them
    for every cell, and the local run was the only one that did not (10 shock cells,
    99.24 %). Reported levels only
  commit: 131339b
- file: comp_altertax.gms
  change: added
  what: comp.gms with the altertax elasticities (Cobb-Douglas value added and nests,
    Armington 0.95, all factors mobile)
  why: the altertax reference model of the bundle builders. It lived untracked in
    ~/proyectos2/cge_babel/standard_gtap_7 and is committed here as found (2026-10-29)
  commit: this change
- file: altertax_config.gms
  change: added
  what: altertax configuration included by the altertax NEOS bundles
  why: altertax reference regeneration (#18)
  commit: 3e758c8
- file: altertax_postmodel.gms
  change: added
  what: altertax post-model block included by the altertax NEOS bundles
  why: altertax reference regeneration (#18)
  commit: 3e758c8
- file: comp_nus333.gms
  change: added
  what: comp.gms with the NUS333 sets (3 sectors x 2 regions, 3 mobile factors)
  why: NUS333 comparison against NEOS
  commit: 37f4f5b
- file: comp_nus333_landshock.gms
  change: added
  what: comp_nus333.gms with a ROW land productivity shock
  why: pin the NUS333 land-shock parity against NEOS
  commit: 54fa5ba
- file: tariff_sim.gms
  change: added
  what: comparative static run with a 10 % import tariff increase
  why: tariff simulation used by the baseline mirror test
  commit: 9ac8ce1
- file: tariff_sim_fixed.gms
  change: added
  what: tariff_sim.gms variant that includes comp.gms from EQUILIBRIA_CGE_BABEL_DIR
  why: tariff simulation against the external copy
  commit: 9ac8ce1
- file: report_fixed_run.inc
  change: added
  what: report of fixed/free variables per period
  why: diagnostics included by cal_dump.gms
  commit: 9ac8ce1
- file: report_fixed_setup.inc
  change: added
  what: set-up of the fixed/free report
  why: diagnostics included by cal_dump.gms
  commit: 9ac8ce1
- file: cal_dump.gms
  change: added
  what: runs calibration only and dumps every symbol to gams_cal_dump_<base>.gdx
  why: calibration parity against Python
  commit: 9ac8ce1
- file: cal_dump_neos.gms
  change: added
  what: cal_dump.gms laid out for NEOS (GTAP include and data conventions)
  why: calibration dump of models above the local license
  commit: 9ac8ce1
- file: tools/build_gtap7_altertax_neos_bundle.py
  change: added
  what: 'builds the altertax NEOS/local bundle (moved from scripts/gtap/); --fbep
    header|zero (#187): header injects the HAR''s FTRV and -FBEP after getData''s
    fbep = 0 (the HAR stores the subsidy negative, cal.gms takes fctts = -fbep/evfb;
    3ba4f88), writes FTRV = 0 where a cell is subsidised with no factor tax (16679d7),
    and keeps HAR labels that already carry the a_ prefix (5368acce); zero leaves
    getData as published'
  why: generates GAMS results from this model, so it lives with it and the model-folder
    sha256 every result records covers it (phase 2b, maintainer 2026-10-30)
  commit: 56b170e, this change
- file: tools/build_gtap7_pure_local_bundle.py
  change: added
  what: 'builds the pure GTAP local bundle (moved from scripts/gtap/); --fbep header|zero
    (#187): header injects the HAR''s FTRV and -FBEP after getData''s fbep = 0 (the
    HAR stores the subsidy negative, cal.gms takes fctts = -fbep/evfb; 3ba4f88), writes
    FTRV = 0 where a cell is subsidised with no factor tax (16679d7), and keeps HAR
    labels that already carry the a_ prefix (5368acce); zero leaves getData as published'
  why: generates GAMS results from this model, so it lives with it and the model-folder
    sha256 every result records covers it (phase 2b, maintainer 2026-10-30)
  commit: 5e0360b, this change
- file: tools/gdx_to_gams_inline.py
  change: added
  what: inlines a GDX as GAMS data statements; finds the GAMS system directory (moved
    from scripts/gtap/)
  why: generates GAMS results from this model, so it lives with it and the model-folder
    sha256 every result records covers it (phase 2b, maintainer 2026-10-30)
  commit: 3e758c8, this change
- file: tools/nl_standalone.py
  change: added
  what: builds the standalone .gms with the data inlined and converts it to .nl with
    CONVERT (extracted from scripts/gtap/nl_compare.py)
  why: generates GAMS results from this model, so it lives with it and the model-folder
    sha256 every result records covers it (phase 2b, maintainer 2026-10-30)
  commit: this change
- file: tools/regen_gams_reference.py
  change: added
  what: solves one GAMS job into a result folder (moved from scripts/gtap/); --nlp-solver
    conopt and --scale-zcons (zcons.scale = zconseq.scale = calibrated zcons.l, set
    before loop(tsim,), used by the 20x41 rows on NEOS
  why: generates GAMS results from this model, so it lives with it and the model-folder
    sha256 every result records covers it (phase 2b, maintainer 2026-10-30). Scaling
    - gtap7_20x41 has SUBPAR at the GTAP floor (1e-6) in 8 of CHE's 20 goods, so zcons(CHE)
    is near 1e-10, below the solver tolerances; PATH stalls (even at a 1% shock) and
    unscaled CONOPT stops at false points (u(CHE) -12.8% zero vs -0.9% header). The
    original model sets scaleopt=1 but no .scale. Scaled, header and zero agree to
    2e-7 (maintainer 2026-11-01; dev-tools notes/cge/2026-11-01)
  commit: 69bef5b, d981ddd6, this change
- file: tools/regenerate_gams.py
  change: added
  what: runs the matrix of local GAMS jobs under write_source (moved from scripts/gtap/)
  why: generates GAMS results from this model, so it lives with it and the model-folder
    sha256 every result records covers it (phase 2b, maintainer 2026-10-30)
  commit: 55c915a, this change
- file: tools/neos_job.py
  change: added
  what: submits one self-contained GAMS MCP bundle to NEOS (cp/PATH/GAMS), polls,
    and keeps out.gdx, model.lst, neos.log and neos_job.json (never the job password
    or an e-mail)
  why: the MCP references above the local PATH license (1000 rows) are solved on NEOS
    and recorded as such (phase 2b, maintainer 2026-10-30)
  commit: this change
- file: tools/har_to_consolidated.py
  change: added
  what: writes a dataset's v7_consolidated.gdx (the schema the bundle builders inline)
    from its basedata.har, sets.har and default.prm; on the datasets that ship one
    it reproduces it record by record
  why: 9x10 comes from the GAMS distribution without a v7_consolidated.gdx; its GAMS
    reference is regenerated with the same builders as the other datasets (maintainer
    2026-11-01, replacing the generator-less COMP_generated.csv)
  commit: this change
- file: tools/regen_nus333.py
  change: added
  what: solves the nus333 GAMS reference locally (its HARs to nus333Sets/Dat/Prm.gdx,
    then comp_nus333.gms) and keeps COMP.gdx as out.gdx; the HAR-to-GDX mapping it
    uses is tools/nus333_bundle.py
  why: the bundle path of scripts/gtap/bench_nus333_dual.py made output/nus333_neos/out.gdx
    (beec5a0) outside data/; it generates a GAMS result from this model, so it lives
    with it (phase 2b Task 6; its output is byte-identical to beec5a0's, md5 2e4d348a)
  commit: this change
- file: tools/nus333_bundle.py
  change: added
  what: maps nus333's HARs to the nus333Sets/Dat/Prm.gdx files getData.gms reads (moved
    from equilibria.babel.har_to_gdx.write_nus333_gdx_bundle; the HAR reader and GDX
    writer stay in the library); its GDX files are byte-identical to the library version's
  why: it decides the data the nus333 GAMS reference runs on; in src/ the model-folder
    sha256 the nus333 record keeps did not cover it, so editing it left the record
    verified (final review of phase 2b)
  commit: this change
