# GTAP v7: nombres de GAMS (declaraciones de comp_*_ifsub{0,1}.gms) <-> equilibria
# (modelo de bloques multiperiodo, ifSUB 0 y 1). ADR-0009.
#
# Una fila por familia, SIN regla por defecto: un nombre igual en los dos lados
# tambien va aca. Cada pareja se leyo en las dos definiciones (la ecuacion del .gms
# y el build_expression del bloque); que los indices cuadren lo verifica
# tests/compare/test_gtap7_names.py, que tambien exige que no falte ninguna familia.
#
#   gams_fixed:        indices de GAMS fijados a un elemento (xaceq(r,i,'hhd',t)).
#   equilibria_extra:  indices que solo tiene equilibria (walras va por periodo).
#   why:               obligatorio en las filas de un solo lado.
#
# El orden de los indices puede diferir (lambdam(rp,i,r) en GAMS, (r,i,rp) en
# equilibria): este diccionario empareja familias, no celdas.
