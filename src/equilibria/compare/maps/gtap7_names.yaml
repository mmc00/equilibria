  # --- solo GAMS ---
  - gams: [pdpeq, pmpeq]
    why: >-
      pdp = pd*(1+dintx) y pmp = pmt*(1+mintx): equilibria las escribe en linea
      (como la macro M_PDP/M_PMP de GAMS con ifSUB=1) en las dos formulaciones.
  - gams: [axpeq, lambdandeq, lambdavaeq, lambdaioeq, lambdafeq]
    why: >-
      shifter(t) = shifter(t-1)*(1+crecimiento): equilibria fija el shifter en su
      valor (instrumento del ShockBlock o parametro); misma matematica en estatica
      comparada. Ojo para R-DYN.
  - gams: pmuveq
    why: "indice de valor unitario de manufacturas: equilibria no lo tiene (R-PMUV)"
  - gams: [glcaleq, afealleq]
    why: "solo del modelo dynCal (calibracion dinamica), no del modelo gtap"
  - gams: [uedeq, incelaseq, cedeq, apeeq]
    why: "elasticidades CDE de reporte, fuera del modelo gtap"

  # --- solo equilibria ---
  - equilibria: [eq_xaa_hhd, eq_xaa_gov, eq_xaa_inv]
    why: >-
      enlace xaa(r,i,h) = xc(r,i) (y gov, inv): equilibria guarda la demanda final
      en xc/xg/xi(r,i); GAMS la escribe directo en xa(r,i,h).
  - equilibria: eq_xd_agg
    why: "agregado xd(r,i) = sum(aa, xda/xscale): GAMS no tiene esa variable"
  - equilibria: [eq_pabs_base, eq_pfact_base]
    why: "anclas pabs = pfact = 1 en base; GAMS las fija con .fx"
  - equilibria:
      - eq_mq_gdp_bs
      - eq_mq_gdp_sb
      - eq_mq_abs_bb
      - eq_mq_abs_sb
      - eq_mq_abs_ss
      - eq_mq_abs_bs
      - eq_mq_factr_bb
      - eq_mq_factr_sb
      - eq_mq_factr_ss
      - eq_mq_factr_bs
      - eq_mq_factw_bb
      - eq_mq_factw_sb
      - eq_mq_factw_ss
      - eq_mq_factw_bs
    why: >-
      agregados de los indices de Fisher (rgdpmp, pabs, pfact, pwfact) entre dos
      periodos, cada uno su fila; GAMS escribe la suma dentro de la ecuacion.

