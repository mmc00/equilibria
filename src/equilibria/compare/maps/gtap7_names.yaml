  - equilibria: aft
    why: "en GAMS aft es Parameter; equilibria lo hace instrumento del ShockBlock"
  - equilibria: [dintx_tgt, mintx_tgt]
    why: "objetivos de @overwrite para dintx/mintx; GAMS fija dintx en iterloop"
