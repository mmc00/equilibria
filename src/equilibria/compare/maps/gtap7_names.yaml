    why: "shifters que equilibria lee como parametro (sh.lambdand, lambdaio), no como Var"
  - gams: pmuv
    why: "equilibria no tiene el indice de valor unitario de manufacturas (R-PMUV)"
  - gams: chiInv
    why: >-
      solo entra en savfeq con capShrFix; el contrato acepta ese cierre pero los
      bloques no tienen chiInv
  - gams: [fctts, etax, mtax, tmarg]
    why: "GAMS las declara Variable y las fija (.fx); equilibria las tiene como parametro"
  - gams: lambdai
    why: "GAMS lo fija en 1 (lambdai.fx = 1); los bloques lo omiten de xaieq"
  - gams: [dtxshft, mtxshft, rtxshft, adtx, mdtx]
    why: >-
      shifters de impuestos que GAMS fija; equilibria mueve dintx/mintx con sus
      objetivos (dintx_tgt, mintx_tgt)
  - gams: [betap, betag, betas, aug, aus, au, bh, eh]
    why: "parametros de utilidad que GAMS calibra (betaCal) o fija; en equilibria son parametros"
  - gams: [ued, ced, ape, incelas]
    why: "elasticidades CDE de reporte (uedeq...), fuera del modelo gtap"
  - gams: [rgdppc, rgdppcgr, gl, ggdppc]
    why: "variables del modelo dinamico (dynCal/dynGTAP)"
  - gams: [emid, emim]
    why: "emisiones: equilibria no modela CO2"
  - gams:
