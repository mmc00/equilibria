# MANAGE-WB (Ghana, one-year baseline): GAMS names <-> equilibria. ADR-0009.
#
# The GAMS side is every equation and variable family of the 2015 solve, as the
# CONVERT dictionary of the recorded run names them
# (data/manage/gha_gtap9/gams_mcp_baseline_y2015_nlpec-ipopt/gha2015_dict.txt;
# tests/templates/manage/test_names.py checks it is complete). equilibria keeps
# GAMS's names (equation e_xfac, variable xfac), so a paired row will read
# {gams: xfac, equilibria: xfac}.
#
# Until a block declares a family, its row is GAMS-only, with the plan's task
# (specs/2026-11-27-manage-template-plan.md) in its why. Groups as in the design's
# equation inventory (specs/templates/manage/changes/manage-template/design.md).
